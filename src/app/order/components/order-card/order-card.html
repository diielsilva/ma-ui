@let order = cardData().order;

<p-panel class="mb-2 p-1">
  <ul>
    <li>
      <span class="font-semibold mr-2">Pagar Com:</span>{{ order.paymentMethod | paymentMethod }}
    </li>
    <li>
      <span class="font-semibold mr-2">Status:</span
      ><span
        [class]="{
          'text-red-500': order.status === 'CANCELLED',
          'text-yellow-500': order.status === 'PENDING',
          'text-green-500': order.status === 'CONFIRMED',
        }"
        >{{ order.status | orderStatus }}</span
      >
    </li>
    <li><span class="font-semibold mr-2">Expira Em:</span>{{ order.dueDate | date }}</li>
    <li>
      <span class="font-semibold mr-2">Valor:</span>
      R$ {{ order.value }}
    </li>
  </ul>
  @if (cardData().isBtnVisible) {
    <div class="w-full flex justify-end">
      <button (click)="onBtnClick.emit(order.id)" type="button" pButton>
        {{ cardData().btnText }}
      </button>
    </div>
  }
</p-panel>
