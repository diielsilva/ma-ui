<app-page-card cardTitle="Pesquisar Pedidos de Incrição">
  <form [formGroup]="searchOrderForm" (ngSubmit)="searchManualOrders()">
    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="text" name="" pInputText formControlName="cpf" id="cpf" />
        <label for="cpf">CPF</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="searchOrderForm.controls.cpf"
        [errors]="searchOrderFormErrors().cpf.errors"
        [messages]="searchOrderFormErrors().cpf.messages"
      />
    </div>
    <button class="w-full" type="submit" [disabled]="searchOrderForm.invalid" pButton>
      Pesquisar
    </button>
  </form>

  @if (pageState() === 1) {
    <div class="mt-4">
      @if (manualOrderCards().length > 0) {
        @for (cardData of manualOrderCards(); track $index) {
          <app-order-card [cardData]="cardData" (onBtnClick)="confirmManualEnrollment($event)" />
        }
      } @else {
        <app-warning-message
          message="O usuário não possui pedidos de inscrição que possam ser confirmados
          manualmente"
        />
      }
    </div>
  }
</app-page-card>
