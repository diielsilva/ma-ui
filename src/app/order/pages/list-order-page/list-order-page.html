<app-page-card cardTitle="Meus Pedidos de Inscrição">
  @if (pageState() === 1 && orderCards().length === 0) {
    <p-message class="mb-2" severity="warn" icon="pi pi-info-circle"
      >Você não possui pedidos de inscrição cadastrados</p-message
    >
  } @else if (pageState() === 1 && orderCards().length > 0) {
    @for (card of orderCards(); track $index) {
      <app-order-card [cardData]="card" (onBtnClick)="handleOrderCardClick($event)" />
    }
  }
  <app-refresh-page-button
    btnText="Recarregar Meus Pedidos"
    [isBtnDisabled]="false"
    (refreshPage)="findAllOrdersOfTheSessionOwner()"
  />
</app-page-card>

<p-dialog [visible]="isPixDetailVisible()" [modal]="true" (onHide)="hidePixDetail()">
  <img class="max-w-75 rounded-sm" src="{{ pixDetail()?.qrCodeUrl }}" title="QR Code Image" />
  <button
    type="button"
    pButton
    class="w-full mt-2"
    [cdkCopyToClipboard]="pixDetail()?.copyAndPasteCode!"
    (cdkCopyToClipboardCopied)="warnUserThatPixCodeWasCopiedToClipboard()"
  >
    {{ copyPixCodeToClipboardBtnText() }}
  </button>
</p-dialog>
