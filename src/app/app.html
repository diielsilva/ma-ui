@if (sessionService.hasSession() && sessionService.isAnAdminSession()) {
  <p-menubar class="w-md sm:w-xl mt-2 mb-2" [model]="adminNavbarItems()"></p-menubar>
} @else if (sessionService.hasSession()) {
  <p-menubar class="w-md sm:w-xl mt-2 mb-2" [model]="userNavbarItems()"></p-menubar>
} @else {
  <p-menubar class="w-md sm:w-xl mt-2 mb-2" [model]="defaultNavbarItems()"></p-menubar>
}

<router-outlet></router-outlet>

<p-toast />

<p-dialog
  [visible]="loadingService.loading()"
  [modal]="true"
  [closeOnEscape]="false"
  [closable]="false"
  [position]="'center'"
  [resizable]="false"
  [draggable]="false"
  [scrollLeft]="false"
  [style]="{ width: '200px', height: '200px', textAlign: 'center' }"
>
  <p-progress-spinner [style]="{ width: '100px', height: '100px' }" />
</p-dialog>
