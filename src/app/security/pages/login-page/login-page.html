<app-page-card cardTitle="Realizar Login">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <div class="mb-2">
      <p-iftalabel>
        <input formControlName="email" id="email" pInputText class="w-full" />
        <label for="email">Email</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="loginForm.controls.email"
        [errors]="loginFormErrors().email.errors"
        [messages]="loginFormErrors().email.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <input type="password" formControlName="password" id="password" pInputText class="w-full" />
        <label for="password">Senha</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="loginForm.controls.password"
        [errors]="loginFormErrors().password.errors"
        [messages]="loginFormErrors().password.messages"
      />
    </div>

    <button type="submit" pButton class="w-full" [disabled]="loginForm.invalid">Entrar</button>
  </form>
</app-page-card>
