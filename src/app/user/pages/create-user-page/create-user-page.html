<app-page-container page="Cadastro de Usuário">
  <form [formGroup]="createUserForm" (ngSubmit)="createUser()">
    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="text" formControlName="name" pInputText id="name" />
        <label for="name">Nome</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.name"
        [errors]="createUserFormErrors().name.errors"
        [messages]="createUserFormErrors().name.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="email" formControlName="email" pInputText id="email" />
        <label for="email">Email</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.email"
        [errors]="createUserFormErrors().email.errors"
        [messages]="createUserFormErrors().email.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="password" formControlName="password" pInputText id="password" />
        <label for="password">Senha</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.password"
        [errors]="createUserFormErrors().password.errors"
        [messages]="createUserFormErrors().password.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="text" formControlName="cpf" pInputText id="cpf" />
        <label for="cpf">CPF</label>
        <small class="italic">O CPF deve conter apenas números.</small>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.cpf"
        [errors]="createUserFormErrors().cpf.errors"
        [messages]="createUserFormErrors().cpf.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <input class="w-full" type="tel" formControlName="phone" pInputText id="phone" />
        <label for="phone">Telefone</label>
        <small class="italic">O telefone deve conter apenas números.</small>

        <app-form-field-error-message
          [field]="createUserForm.controls.phone"
          [errors]="createUserFormErrors().phone.errors"
          [messages]="createUserFormErrors().phone.messages"
        />
      </p-iftalabel>
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <p-select class="w-full" formControlName="gender" [options]="genders" id="genders" />

        <label for="genders">Sexo</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.gender"
        [errors]="createUserFormErrors().gender.errors"
        [messages]="createUserFormErrors().gender.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <p-datePicker
          class="w-full"
          formControlName="birthDate"
          id="birth-date"
          dateFormat="dd/mm/yy"
        ></p-datePicker>
        <label for="birth-date">Data de Nascimento</label>
      </p-iftalabel>

      <app-form-field-error-message
        [field]="createUserForm.controls.birthDate"
        [errors]="createUserFormErrors().birthDate.errors"
        [messages]="createUserFormErrors().birthDate.messages"
      />
    </div>

    <div class="mb-2">
      <p-iftalabel>
        <textarea
          class="w-full min-h-50"
          formControlName="disabilities"
          pTextarea
          id="disabilities"
        ></textarea>
        <label for="disabilities">Restrições</label>
        <small class="italic">Preencher caso haja alguma restrição de saúde.</small>
      </p-iftalabel>
    </div>

    <button class="w-full" type="submit" pButton [disabled]="createUserForm.invalid">
      Cadastrar
    </button>
  </form>
</app-page-container>
